<style>
:root{--brand:#D4AF37;--bg:#0D0E10;--surface:#17191D;--surface2:#202329;--text:#F6F1E7;--muted:#A9A39A}*{box-sizing:border-box}html{background:var(--bg)}body{font-family:Cairo,sans-serif;background:var(--bg);color:var(--text);margin:0;transition:background .25s,color .25s}.brand{font-family:Poppins,Cairo,sans-serif}.luxury-page{background:radial-gradient(circle at 85% 0%,color-mix(in srgb,var(--brand) 12%,transparent),transparent 28%),radial-gradient(circle at 10% 40%,color-mix(in srgb,var(--brand) 7%,transparent),transparent 30%),var(--bg)}.luxury-header{background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(18px);border-bottom:1px solid color-mix(in srgb,var(--text) 10%,transparent)}.brand-logo{width:50px;height:50px;border-radius:17px;display:grid;place-items:center;font-size:27px;background:linear-gradient(145deg,var(--surface2),var(--surface));border:1px solid color-mix(in srgb,var(--brand) 45%,transparent);box-shadow:0 10px 28px #0007}.cart-btn,.add-btn{border:0;background:linear-gradient(135deg,var(--brand),color-mix(in srgb,var(--brand) 65%,white));color:#111;font-weight:900;border-radius:15px;padding:12px 18px;box-shadow:0 8px 24px color-mix(in srgb,var(--brand) 18%,transparent)}.lux-card{background:var(--surface);border:1px solid color-mix(in srgb,var(--text) 10%,transparent)}.modal{background:#000b;backdrop-filter:blur(5px)}input,textarea,select{background:var(--surface)!important;color:var(--text)!important;border-color:color-mix(in srgb,var(--text) 14%,transparent)!important}input::placeholder,textarea::placeholder{color:var(--muted)!important}.toast{animation:toast .25s ease}@keyframes toast{from{transform:translateY(15px);opacity:0}to{transform:none;opacity:1}}.bg-white{background:var(--surface)!important;color:var(--text)!important}.bg-gray-100,.bg-gray-50{background:var(--surface2)!important;color:var(--text)!important}.text-gray-500,.text-gray-600,.text-gray-700{color:var(--muted)!important}.border,.border-b,.border-t,.border-gray-200{border-color:color-mix(in srgb,var(--text) 12%,transparent)!important}.text-blue-600{color:var(--brand)!important}.text-red-600{color:#ff6b6b!important}.shadow-xl{box-shadow:0 24px 70px #0008!important}.modal .bg-white{background:linear-gradient(145deg,var(--surface),var(--surface2))!important;color:var(--text)!important;border:1px solid color-mix(in srgb,var(--brand) 22%,transparent)}.modal .bg-gray-100{background:color-mix(in srgb,var(--brand) 8%,var(--surface2))!important}.modal input,.modal textarea,.modal select,input,textarea,select{border-radius:16px!important}select option{background:#17191d;color:#f6f1e7}.checkout-modal{background:linear-gradient(145deg,var(--surface),var(--surface2));color:var(--text);border:1px solid color-mix(in srgb,var(--brand) 20%,transparent);box-shadow:0 24px 80px #000a}.checkout-note{background:color-mix(in srgb,var(--surface2) 88%,white 12%);color:var(--text);border:1px solid color-mix(in srgb,var(--brand) 16%,transparent)}.vodafone-box{background:color-mix(in srgb,var(--surface2) 94%,var(--brand) 6%);color:var(--text);border:1px solid color-mix(in srgb,var(--brand) 28%,transparent)}.vodafone-box input{background:var(--surface)!important;color:var(--text)!important}.dineWaLink{cursor:pointer}#dineWaLink{cursor:pointer}
</style>
</head>
<body>
<div id="app"></div>

<script src="config.js?v=3"></script>
<script src="app.js?v=10"></script>
<script src="cart-bridge.js?v=3"></script>
<script src="delivery-gps-clean-v2.js?v=3"></script>
<script src="delivery-admin-enhancements.js?v=2"></script>
<script src="delivery-hardening-v4.js?v=3"></script>
<script src="driver-app-v1.js?v=2"></script>
<script src="driver-fix-v3.js?v=1"></script>
<script src="pwa-install.js?v=10"></script>
<script>
window.addEventListener('load',function(){
  setTimeout(function(){
    try{
      var s=document.createElement('script');
      s.src='delivery-v7-features.js?v=2';
      s.async=true;
      s.onerror=function(){console.warn('Delivery V7 failed to load; core app remains active')};
      document.body.appendChild(s);
    }catch(e){console.warn('Delivery V7 loader',e)}
  },1200);
});
</script>
