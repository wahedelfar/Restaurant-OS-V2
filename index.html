<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Restaurant OS">

  <title>ذا بيتزا برجر كافيه</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;
      background: #0b0b0b;
      color: #fff;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    img {
      max-width: 100%;
      display: block;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    ::selection {
      background: #d4af37;
      color: #111;
    }

    #app {
      min-height: 100vh;
    }
  </style>
</head>

<body>

  <div id="app"></div>

  <!-- App Configuration -->
  <script src="config.js"></script>

  <!-- Main Application -->
  <script src="app.js?v=7"></script>

  <!-- Delivery + GPS
       IMPORTANT:
       delivery-gps.js is intentionally NOT loaded.
       delivery-gps-fix.js already contains the delivery admin/tracking logic.
  -->
  <script src="delivery-gps-fix.js?v=3"></script>

  <!-- PWA -->
  <script src="pwa-install.js?v=7"></script>

</body>
</html>
