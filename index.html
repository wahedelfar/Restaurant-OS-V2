:root{--brand:#D4AF37;--bg:#0D0E10;--surface:#17191D;--surface2:#202329;--text:#F6F1E7;--muted:#A9A39A}*{box-sizing:border-box}html{background:var(--bg)}body{font-family:Cairo,sans-serif;background:var(--bg);color:var(--text);margin:0;transition:background .25s,color .25s}.brand{font-family:Poppins,Cairo,sans-serif}.luxury-page{background:radial-gradient(circle at 85% 0%,color-mix(in srgb,var(--brand) 12%,transparent),transparent 28%),radial-gradient(circle at 10% 40%,color-mix(in srgb,var(--brand) 7%,transparent),transparent 30%),var(--bg)}.luxury-header{background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(18px);border-bottom:1px solid color-mix(in srgb,var(--text) 10%,transparent)}.brand-logo{width:50px;height:50px;border-radius:17px;display:grid;place-items:center;font-size:27px;background:linear-gradient(145deg,var(--surface2),var(--surface));border:1px solid color-mix(in srgb,var(--brand) 45%,transparent);box-shadow:0 10px 28px #0007}.cart-btn,.add-btn{border:0;background:linear-gradient(135deg,var(--brand),color-mix(in srgb,var(--brand) 65%,white));color:#111;font-weight:900;border-radius:15px;padding:12px 18px;box-shadow:0 8px 24px color-mix(in srgb,var(--brand) 18%,transparent)}.lux-hero{position:relative;overflow:hidden;min-height:250px;padding:32px;border-radius:30px;margin-bottom:18px;background:linear-gradient(135deg,var(--surface),var(--surface2));border:1px solid color-mix(in srgb,var(--brand) 25%,transparent);box-shadow:0 22px 60px #0008}.lux-hero:before{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 15%,color-mix(in srgb,var(--brand) 8%,transparent),transparent 70%);pointer-events:none}.hero-glow{position:absolute;width:260px;height:260px;right:-80px;top:-100px;border-radius:50%;background:color-mix(in srgb,var(--brand) 20%,transparent);filter:blur(30px)}.lux-hero h1{font-size:clamp(32px,7vw,58px);line-height:1.15;font-weight:900;margin:0;max-width:650px}.lux-hero p{max-width:620px;color:var(--muted);font-size:15px;line-height:1.9;margin:12px 0}.hero-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.hero-meta span{font-size:11px;font-weight:700;padding:7px 10px;border-radius:999px;background:color-mix(in srgb,var(--brand) 10%,transparent);border:1px solid color-mix(in srgb,var(--brand) 20%,transparent);color:var(--text)}.cat-pill{shrink:0;border:1px solid color-mix(in srgb,var(--text) 10%,transparent);background:var(--surface);color:var(--muted);padding:11px 18px;border-radius:999px;font-weight:800;white-space:nowrap}.cat-pill.active{background:var(--brand);color:#111;border-color:var(--brand);box-shadow:0 8px 22px color-mix(in srgb,var(--brand) 18%,transparent)}.product-card-lux{overflow:hidden;border-radius:26px;background:linear-gradient(145deg,var(--surface),color-mix(in srgb,var(--surface) 85%,#000));border:1px solid color-mix(in srgb,var(--text) 9%,transparent);box-shadow:0 15px 45px #0006;transition:transform .2s,border-color .2s,box-shadow .2s}.product-card-lux:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--brand) 30%,transparent);box-shadow:0 20px 55px #0008}.product-image-wrap{height:230px;position:relative;background:var(--surface2);overflow:hidden}.product-image-wrap img{width:100%;height:100%;object-fit:cover;display:block}.product-image-wrap:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,#0009 100%);pointer-events:none}.price-chip{position:absolute;z-index:2;right:12px;bottom:12px;padding:7px 11px;border-radius:12px;background:#111d;color:#fff;font-weight:900;backdrop-filter:blur(8px);border:1px solid #fff2}.add-btn{padding:9px 14px;border-radius:12px;font-size:13px}.luxury-scroll{scrollbar-width:none}.luxury-scroll::-webkit-scrollbar{display:none}.lux-card{background:var(--surface);border:1px solid color-mix(in srgb,var(--text) 10%,transparent)}.modal{background:#000b;backdrop-filter:blur(5px)}input,textarea,select{background:var(--surface)!important;color:var(--text)!important;border-color:color-mix(in srgb,var(--text) 14%,transparent)!important}input::placeholder,textarea::placeholder{color:var(--muted)!important}.toast{animation:toast .25s ease}@keyframes toast{from{transform:translateY(15px);opacity:0}to{transform:none;opacity:1}}.bg-white{background:var(--surface)!important;color:var(--text)!important}.bg-gray-100,.bg-gray-50{background:var(--surface2)!important;color:var(--text)!important}.text-gray-500,.text-gray-600,.text-gray-700{color:var(--muted)!important}.border,.border-b,.border-t,.border-gray-200{border-color:color-mix(in srgb,var(--text) 12%,transparent)!important}.text-blue-600{color:var(--brand)!important}.text-red-600{color:#ff6b6b!important}.shadow-xl{box-shadow:0 24px 70px #0008!important}.modal .bg-white{background:linear-gradient(145deg,var(--surface),var(--surface2))!important;color:var(--text)!important;border:1px solid color-mix(in srgb,var(--brand) 22%,transparent)}.modal .bg-gray-100{background:color-mix(in srgb,var(--brand) 8%,var(--surface2))!important}.modal input,.modal textarea,.modal select,input,textarea,select{border-radius:16px!important}select option{background:#17191d;color:#f6f1e7}.checkout-modal{background:linear-gradient(145deg,var(--surface),var(--surface2));color:var(--text);border:1px solid color-mix(in srgb,var(--brand) 20%,transparent);box-shadow:0 24px 80px #000a}.checkout-note{background:color-mix(in srgb,var(--surface2) 88%,white 12%);color:var(--text);border:1px solid color-mix(in srgb,var(--brand) 16%,transparent)}.vodafone-box{background:color-mix(in srgb,var(--surface2) 94%,var(--brand) 6%);color:var(--text);border:1px solid color-mix(in srgb,var(--brand) 28%,transparent)}.vodafone-box input{background:var(--surface)!important;color:var(--text)!important}.dineWaLink{cursor:pointer}#dineWaLink{cursor:pointer}
