<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>المطبخ - Restaurant OS</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>body{font-family:Cairo,sans-serif;background:#0b0d10}.hidden{display:none!important}.card{background:#fff;color:#111;border-radius:24px;box-shadow:0 18px 50px #0005}.btn{border-radius:14px;padding:11px 12px;font-weight:800}.sel{outline:3px solid #111;outline-offset:1px}</style>
</head>
<body class="min-h-screen text-white">
<header class="sticky top-0 z-30 bg-slate-950/95 backdrop-blur border-b border-slate-800 px-4 py-4"><div class="max-w-7xl mx-auto flex justify-between items-center gap-3"><div><h1 class="text-2xl font-black">إدارة المطبخ</h1><p id="conn" class="text-xs text-slate-400">جارٍ الاتصال...</p></div><button id="unlock" class="btn bg-amber-400 text-slate-950">تفعيل صوت الإشعارات</button></div></header>
<main class="max-w-7xl mx-auto p-4"><div id="login" class="max-w-md mx-auto mt-10 bg-slate-900 border border-slate-800 rounded-3xl p-6"><h2 class="text-xl font-black mb-4">دخول المطبخ</h2><input id="pin" maxlength="4" inputmode="numeric" type="password" placeholder="PIN" class="w-full rounded-2xl bg-slate-950 border border-slate-700 p-4 text-center text-2xl tracking-[.5em]"><button id="enter" class="btn w-full mt-4 bg-amber-400 text-slate-950">دخول</button><p id="err" class="text-red-400 text-sm mt-3"></p></div><section id="orders" class="hidden grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5"></section><div id="empty" class="hidden text-center text-slate-500 py-20">لا توجد طلبات حالياً.</div></main>
<script>
const URL='https://znnnkoujfuweydvbkejh.supabase.co',KEY='sb_publishable_gjYA4-E-BL0X1hc3YugqyQ_1VaOo_se',RID='02da399f-b12d-480b-bf53-5491bbe8f9e5',PIN='1234';
let db=null,ch=null,unlocked=false,orders=[];const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));
function audio(){try{if(!window.ctx)window.ctx=new(window.AudioContext||window.webkitAudioContext)();window.ctx.resume();unlocked=true;$('unlock').textContent='الصوت مفعّل'}catch(e){}}
$('unlock').onclick=audio;document.addEventListener('pointerdown',audio,{once:true});
function ping(success=false){if(!unlocked)return;try{const now=ctx.currentTime,[a,b,c]=success?[784,988,1174]:[520,660,880];[a,b,c].forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;g.gain.setValueAtTime(.0001,now+i*.1);g.gain.exponentialRampToValueAtTime(.18,now+i*.1+.02);g.gain.exponentialRampToValueAtTime(.0001,now+i*.1+.08);o.connect(g);g.connect(ctx.destination);o.start(now+i*.1);o.stop(now+i*.1+.09)})}catch(e){}}
function note(t,x){const n=document.createElement('div');n.className='fixed top-20 right-4 z-50 bg-slate-900 border border-amber-400/40 rounded-2xl px-4 py-3 shadow-2xl';n.innerHTML='<b>'+esc(t)+'</b><div class="text-xs text-slate-300 mt-1">'+esc(x)+'</div>';document.body.appendChild(n);setTimeout(()=>n.remove(),5000)}
function statusLabel(s){return({received:'تم استلام الطلب',preparing:'جاري التجهيز',ready:'تم تجهيز الطلب'}[s]||'تم استلام الطلب')}
function normStatus(s){s=String(s||'').toLowerCase();return s==='cooking'?'preparing':['received','preparing','ready'].includes(s)?s:'received'}
function items(o){const a=Array.isArray(o.items)?o.items:[];return a.map(x=>typeof x==='string'?x:(x.name||x.title||x.product_name||'صنف')+' × '+(x.quantity||x.qty||1)).join('، ')}
async function load(silent=false){const q=await db.from('orders').select('id,order_type,table_number,customer_name,customer_phone,total,items,kitchen_status,prep_minutes,admin_message,created_at,status').eq('restaurant_id',RID).eq('is_hidden_from_kds',false).order('created_at',{ascending:false}).limit(50);if(q.error){$('conn').textContent='خطأ في الاتصال';console.error(q.error);return}orders=(q.data||[]).filter(o=>!['cancelled','canceled','delivered'].includes(String(o.status||'').toLowerCase()));render();if(!silent)$('conn').textContent='متصل — تحديث مباشر'}
function render(){const root=$('orders');root.innerHTML='';$('empty').classList.toggle('hidden',!orders.length);orders.forEach(o=>{const st=normStatus(o.kitchen_status),dine=o.order_type==='dine_in',card=document.createElement('article');card.className='card overflow-hidden border-4 '+(st==='ready'?'border-emerald-500':st==='preparing'?'border-amber-500':'border-red-500');card.innerHTML=`<div class="bg-slate-900 text-white p-4 flex justify-between gap-2"><b>${dine?'ترابيزة '+esc(o.table_number):'طلب دليفري'}</b><span class="text-xs text-slate-300">${new Date(o.created_at).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})}</span></div><div class="p-4 space-y-4"><div><div class="font-black">${esc(o.customer_name||'عميل')}</div><div class="text-sm text-slate-500 mt-1">${esc(items(o)||'لا توجد أصناف')}</div></div>${dine?`<div><div class="font-black mb-2">وقت التجهيز <span class="text-xs font-normal text-slate-500">(5–30 دقيقة)</span></div><div class="grid grid-cols-3 gap-2">${[5,10,15,20,25,30].map(n=>`<button class="btn border ${Number(o.prep_minutes)===n?'sel bg-amber-300':'bg-slate-100'}" data-prep="${o.id}" data-min="${n}">${n} د</button>`).join('')}</div><div class="text-sm mt-2 text-slate-500">${o.prep_minutes?`الوقت المحدد: ${o.prep_minutes} دقيقة`:'لم يتم تحديد وقت بعد'}</div></div>`:''}<div><div class="font-black mb-2">الحالة</div><div class="grid grid-cols-3 gap-2"><button class="btn bg-slate-200" data-st="${o.id}" data-v="received">استلام</button><button class="btn bg-amber-400" data-st="${o.id}" data-v="preparing">جاري التجهيز</button><button class="btn bg-emerald-400" data-st="${o.id}" data-v="ready">تم التجهيز</button></div></div>${dine?`<div><div class="font-black mb-2">رسالة ختام الطلب عند التجهيز</div><div class="grid grid-cols-1 gap-2"><button class="btn border text-right ${o.admin_message==='شرفتنا يا فندم'?'sel bg-amber-100':''}" data-msg="${o.id}" data-v="شرفتنا يا فندم">شرفتنا يا فندم</button><button class="btn border text-right ${o.admin_message==='نتمنى أن ننال رضاكم'?'sel bg-amber-100':''}" data-msg="${o.id}" data-v="نتمنى أن ننال رضاكم">نتمنى أن ننال رضاكم</button></div></div>`:''}<div class="rounded-2xl bg-slate-100 p-3"><div class="text-xs text-slate-500">الحالة الحالية</div><b>${esc(statusLabel(st))}</b>${o.prep_minutes?`<div class="text-xs text-slate-500 mt-1">وقت التجهيز: ${o.prep_minutes} دقيقة</div>`:''}</div></div>`;root.appendChild(card)});bind()}
function bind(){document.querySelectorAll('[data-prep]').forEach(b=>b.onclick=async()=>{b.disabled=true;const id=b.dataset.prep,min=Number(b.dataset.min);const r=await db.from('orders').update({prep_minutes:min}).eq('id',id).eq('restaurant_id',RID);if(r.error)note('تعذر الحفظ',r.error.message);else{note('تم تحديد وقت التجهيز',min+' دقيقة');ping();await load(true)}b.disabled=false});document.querySelectorAll('[data-msg]').forEach(b=>b.onclick=async()=>{b.disabled=true;const r=await db.from('orders').update({admin_message:b.dataset.v}).eq('id',b.dataset.msg).eq('restaurant_id',RID);if(r.error)note('تعذر حفظ الرسالة',r.error.message);else{note('تم حفظ رسالة الختام',b.dataset.v);ping(true);await load(true)}b.disabled=false});document.querySelectorAll('[data-st]').forEach(b=>b.onclick=async()=>{b.disabled=true;const id=b.dataset.st,v=b.dataset.v;let msg=null;if(v==='preparing')msg='جاري تجهيز طلب حضرتك';if(v==='ready'){const o=orders.find(x=>String(x.id)===String(id));msg=(o&&['شرفتنا يا فندم','نتمنى أن ننال رضاكم'].includes(o.admin_message))?o.admin_message:'تم تجهيز طلبك'}const patch={kitchen_status:v,admin_message:msg||null};const r=await db.from('orders').update(patch).eq('id',id).eq('restaurant_id',RID);if(r.error)note('تعذر تحديث الحالة',r.error.message);else{note('تحديث المطبخ',statusLabel(v));ping(v==='ready');await load(true)}b.disabled=false})}
async function start(){db=window.supabase.createClient(URL,KEY);$('login').classList.add('hidden');$('orders').classList.remove('hidden');await load();ch=db.channel('kitchen-live-'+RID).on('postgres_changes',{event:'INSERT',schema:'public',table:'orders',filter:'restaurant_id=eq.'+RID},p=>{if(p.new?.order_type){note('طلب جديد','وصل طلب جديد إلى المطبخ');ping();load(true)}}).on('postgres_changes',{event:'UPDATE',schema:'public',table:'orders',filter:'restaurant_id=eq.'+RID},p=>{if(p.new?.id){load(true)}}).subscribe(s=>{$('conn').textContent=s==='SUBSCRIBED'?'متصل — تحديث مباشر':'جارٍ إعادة الاتصال...' });setInterval(()=>load(true),15000)}
$('enter').onclick=()=>{$('err').textContent='';if($('pin').value.trim()!==PIN){$('err').textContent='PIN غير صحيح';return}audio();start()};$('pin').addEventListener('keydown',e=>{if(e.key==='Enter')$('enter').click()});
</script>
</body></html>
