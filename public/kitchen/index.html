<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المطبخ</title>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{margin:0;background:#0f172a;color:#fff}
.login{height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#1f2937;padding:32px;border-radius:16px;width:340px;text-align:center}
input{width:100%;padding:14px;border-radius:10px;border:none;margin:16px 0;font-size:22px;text-align:center;letter-spacing:8px}
button{width:100%;padding:14px;border:none;border-radius:10px;background:#f59e0b;font-weight:700;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:12px}
.col{background:#1e293b;border-radius:12px;min-height:80vh;padding:10px}
.col h2{font-size:16px;text-align:center;border-bottom:1px solid #334155;padding-bottom:8px}
.order{background:#fff;color:#000;border-radius:10px;padding:10px;margin:8px 0}
.hidden{display:none}
</style>
</head>
<body>
<div id="login" class="login">
  <div class="card">
    <h1>🔒 مطبخ</h1>
    <input id="pin" type="tel" maxlength="4" placeholder="1234" inputmode="numeric">
    <button onclick="login()">دخول</button>
    <p id="err" style="color:#ef4444;display:none">PIN غلط - جرب 1234</p>
  </div>
</div>
<div id="app" class="hidden">
  <div style="padding:12px;background:#111827;display:flex;justify-content:space-between"><b>🍳 المطبخ شغال</b><button onclick="localStorage.clear();location.reload()" style="width:auto;padding:6px 12px;background:#334155;color:#fff">خروج</button></div>
  <div class="grid">
    <div class="col"><h2>🔴 جديد</h2><div id="new"></div></div>
    <div class="col"><h2>🟡 تحضير</h2><div id="prep"></div></div>
    <div class="col"><h2>🟢 جاهز</h2><div id="ready"></div></div>
  </div>
</div>
<audio id="ding" src="https://assets.mixkit.co/sfx/preview/mixkit-alarm-digital-clock-beep-989.mp3" preload="auto"></audio>
<script>
const PIN="1234";
function login(){
  const v=document.getElementById('pin').value.trim();
  console.log('try pin',v);
  if(v===PIN){localStorage.setItem('kitchen_auth','1');show();}
  else{document.getElementById('err').style.display='block';}
}
function show(){
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  loadOrders();
}
function loadOrders(){
  let orders=[];
  try{orders=JSON.parse(localStorage.getItem('restaurant_orders')||'[]');}catch{}
  if(orders.length===0){
    orders=[{id:'TEST-1',table:5,details:'2 شاورما + بيبسي',state:'new',time:new Date().toLocaleTimeString('ar-EG')}];
  }
  document.getElementById('new').innerHTML='';
  document.getElementById('prep').innerHTML='';
  document.getElementById('ready').innerHTML='';
  orders.forEach(o=>{
    const d=document.createElement('div');d.className='order';
    d.innerHTML=`<b>#${o.id}</b><br>${o.details||'اوردر'}<br><small>${o.time||''}</small><div style="display:flex;gap:4px;margin-top:6px">
    ${o.state==='new'?'<button onclick="move(\''+o.id+'\',\'prep\')">تحضير</button>':''}
    ${o.state==='prep'?'<button onclick="move(\''+o.id+'\',\'ready\')">جاهز</button>':''}
    </div>`;
    if(o.state==='new')document.getElementById('new').appendChild(d);
    else if(o.state==='prep')document.getElementById('prep').appendChild(d);
    else document.getElementById('ready').appendChild(d);
  });
}
function move(id,s){let os=JSON.parse(localStorage.getItem('restaurant_orders')||'[]');if(os.length===0){os=[{id:id,details:'تيست',state:s,time:''}];}else{os=os.map(o=>o.id==id?{...o,state:s}:o);}localStorage.setItem('restaurant_orders',JSON.stringify(os));loadOrders();document.getElementById('ding').play().catch(()=>{});}
if(localStorage.getItem('kitchen_auth')==='1')show();
document.getElementById('pin').addEventListener('keydown',e=>{if(e.key==='Enter')login();});
</script>
</body>
</html>
