<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>المطبخ</title>
<style>
*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#0f172a;color:#fff}
.login{height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#1e293b;padding:32px;border-radius:16px;width:320px;text-align:center}
input{width:100%;padding:14px;border-radius:10px;border:2px solid #334155;background:#0f172a;color:#fff;margin:14px 0;font-size:24px;text-align:center;letter-spacing:8px;outline:none}
input:focus{border-color:#f59e0b}
button{width:100%;padding:14px;border:none;border-radius:10px;background:#f59e0b;font-weight:800;font-size:16px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:10px}
.col{background:#1e293b;border-radius:12px;min-height:80vh;padding:10px}
.col h2{font-size:14px;text-align:center;border-bottom:1px solid #334155;padding-bottom:8px;margin:0 0 10px}
.order{background:#fff;color:#000;border-radius:10px;padding:10px;margin:8px 0}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="L" class="login">
  <div class="card">
    <h2>🔒 مطبخ</h2>
    <input id="pin" type="tel" maxlength="4" placeholder="----" autocomplete="off">
    <button id="btn">دخول</button>
    <p id="err" style="color:#ef4444;display:none;margin:10px 0 0">PIN غلط - اكتب 1234</p>
  </div>
</div>
<div id="A" class="hidden">
  <div style="padding:10px;background:#111827;display:flex;justify-content:space-between"><b>🍳 المطبخ</b><button onclick="localStorage.removeItem('k_auth');location.reload()" style="width:auto;padding:6px 12px;background:#334155;color:#fff;border:none;border-radius:8px;cursor:pointer">خروج</button></div>
  <div class="grid">
    <div class="col"><h2>🔴 جديد</h2><div id="n"></div></div>
    <div class="col"><h2>🟡 تحضير</h2><div id="p"></div></div>
    <div class="col"><h2>🟢 جاهز</h2><div id="r"></div></div>
  </div>
</div>
<script>
const PIN='1234';
function doLogin(){
  const v=document.getElementById('pin').value.trim();
  if(v===PIN){localStorage.setItem('k_auth','1');show();}else{document.getElementById('err').style.display='block';document.getElementById('pin').value='';document.getElementById('pin').focus();}
}
function show(){document.getElementById('L').classList.add('hidden');document.getElementById('A').classList.remove('hidden');load();}
function load(){
  const d=document.getElementById('n');d.innerHTML='<div class="order"><b>#TEST-1</b><br>2 شاورما<br><small>'+new Date().toLocaleTimeString('ar-EG')+'</small><br><button onclick="this.parentElement.remove()" style="margin-top:6px;background:#f59e0b;border:none;padding:6px 10px;border-radius:6px;cursor:pointer">تحضير</button></div>';
}
document.getElementById('btn').onclick=doLogin;
document.getElementById('pin').onkeydown=e=>{if(e.key==='Enter')doLogin();};
if(localStorage.getItem('k_auth')==='1')show();
</script>
</body>
</html>
