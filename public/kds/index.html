<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ادارة المطبخ</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>body{font-family:'Cairo',sans-serif}.hidden{display:none!important}</style>
</head>
<body class="bg-slate-950 text-white min-h-screen p-4">
<div id="configScreen" class="min-h-screen flex items-center justify-center">
  <div class="w-full max-w-md bg-slate-900 p-6 rounded-2xl">
    <h1 class="text-2xl font-bold mb-2">ادارة المطبخ</h1>
    <p class="text-slate-400 mb-6">مربوط بـ orders مباشرة - بدون جدول katchen</p>
    <label class="text-sm">Supabase URL</label>
    <input id="supabaseUrl" class="w-full p-3 rounded-lg bg-slate-800 mb-4 mt-1" value="https://znnnkoujfuweydvbkejh.supabase.co"/>
    <label class="text-sm">Supabase ANON KEY</label>
    <input id="supabaseKey" class="w-full p-3 rounded-lg bg-slate-800 mb-4 mt-1" placeholder="sb_publishable_..."/>
    <label class="text-sm">PIN المطبخ</label>
    <input id="pin" type="password" class="w-full p-3 rounded-lg bg-slate-800 mb-6 mt-1" placeholder="1234"/>
    <button id="saveConfig" class="w-full bg-white text-black p-3 rounded-lg font-bold">دخول المطبخ</button>
    <p id="configError" class="text-red-400 text-sm mt-3 hidden"></p>
  </div>
</div>

<div id="kdsScreen" class="hidden">
  <div class="flex justify-between items-center mb-4">
    <h1 class="text-xl font-bold">طلبات المطبخ - Live من orders</h1>
    <div class="flex gap-2"><button id="filterAll" class="px-3 py-1 bg-white text-black rounded">الكل</button><button id="filterDine" class="px-3 py-1 bg-slate-800 rounded">داخلي</button><button id="filterDel" class="px-3 py-1 bg-slate-800 rounded">دليفري</button></div>
  </div>
  <div id="ordersGrid" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
</div>

<script>
const API = "https://znnnkoujfuweydvbkejh.supabase.co/functions/v1/kitchen-api";
let SB_URL="",SB_KEY="";
document.getElementById('saveConfig').onclick = async ()=>{
  SB_URL=document.getElementById('supabaseUrl').value.trim();
  SB_KEY=document.getElementById('supabaseKey').value.trim();
  const pin=document.getElementById('pin').value.trim();
  const err=document.getElementById('configError');
  if(!SB_URL||!SB_KEY||!pin){err.textContent='اكمل البيانات';err.classList.remove('hidden');return}
  try{
    const r=await fetch(API, {method:'POST', headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}, body: JSON.stringify({action:'verify_pin', pin})});
    const j=await r.json();
    if(!j.ok) throw new Error(j.error||'PIN غلط');
    localStorage.setItem('sb_url',SB_URL); localStorage.setItem('sb_key',SB_KEY);
    document.getElementById('configScreen').classList.add('hidden');
    document.getElementById('kdsScreen').classList.remove('hidden');
    loadOrders();
    setInterval(loadOrders,5000);
  }catch(e){err.textContent=e.message;err.classList.remove('hidden');}
};
async function loadOrders(){
  const r=await fetch(API, {method:'POST', headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}, body: JSON.stringify({action:'list'})});
  const j=await r.json();
  const grid=document.getElementById('ordersGrid'); grid.innerHTML='';
  (j.orders||[]).forEach(o=>{
    const d=document.createElement('div'); d.className='bg-slate-900 p-4 rounded-xl';
    d.innerHTML=`<div class="flex justify-between"><span class="font-bold">#${o.id}</span><span class="text-xs ${o.order_type=='delivery'?'bg-orange-500':'bg-blue-500'} px-2 py-1 rounded">${o.order_type}</span></div><p class="mt-2 text-slate-300">${o.items||''}</p><p class="mt-2 text-sm">الحالة: ${o.kitchen_status}</p><div class="flex gap-2 mt-3"><button onclick="updateStatus(${o.id},'preparing')" class="flex-1 bg-yellow-500 text-black py-1 rounded">تحضير</button><button onclick="updateStatus(${o.id},'ready')" class="flex-1 bg-green-500 text-black py-1 rounded">جاهز</button></div>`;
    grid.appendChild(d);
  });
}
async function updateStatus(id,status){
  await fetch(API, {method:'POST', headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}, body: JSON.stringify({action:'update_status', id, status})});
  loadOrders();
}
</script>
</body>
</html>
