<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إدارة المطبخ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="manifest" href="/kds/manifest.json?v=1" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=3" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png?v=3" />
  <meta name="theme-color" content="#0D0E10" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>body{font-family:'Cairo',sans-serif}.hidden{display:none!important}</style>
</head>
<body class="bg-slate-950 text-white min-h-screen">
  <div id="configScreen" class="hidden min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
      <h1 class="text-2xl font-extrabold mb-2">إدارة المطبخ</h1>
      <p class="text-slate-400 mb-6">هذه الشاشة التقنية لم تعد مطلوبة.</p>
      <label class="hidden">Supabase URL</label>
      <input id="supabaseUrl" type="hidden" />
      <label class="hidden">Supabase Publishable/Anon Key</label>
      <input id="supabaseKey" type="hidden" />
      <button id="saveConfig" class="hidden">حفظ وتشغيل</button>
      <p id="configError" class="text-red-400 text-sm mt-3 hidden"></p>
    </div>
  </div>

  <div id="pinScreen" class="hidden min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl text-center">
      <div class="text-4xl mb-3">🔒</div>
      <h1 class="text-2xl font-extrabold mb-6">إدارة المطبخ</h1>
      <input id="pin" inputmode="numeric" type="password" maxlength="4" placeholder="PIN" class="w-full text-center text-3xl tracking-[0.5em] rounded-xl bg-slate-950 border border-slate-700 px-4 py-4 mb-4 outline-none focus:border-amber-500" />
      <button id="login" class="w-full rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold py-3">دخول</button>
      <p id="pinError" class="text-red-400 text-sm mt-3 hidden">PIN غير صحيح</p>
    </div>
  </div>

  <main id="app" class="hidden">
    <header class="sticky top-0 z-20 bg-slate-900/95 backdrop-blur border-b border-slate-800 px-4 py-3 flex items-center justify-between gap-3">
      <div><h1 class="text-xl md:text-2xl font-extrabold">إدارة المطبخ</h1><p id="connection" class="text-xs text-slate-400">جارٍ الاتصال...</p></div>
      <button id="logout" class="rounded-lg bg-slate-800 hover:bg-slate-700 px-3 py-2 text-sm font-bold">خروج</button>
    </header>
    <section id="orders" class="p-4 grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4"></section>
    <div id="empty" class="hidden text-center text-slate-500 py-16">لا توجد طلبات.</div>
  </main>

  <script>
    const SUPABASE_URL='https://znnnkoujfuweydvbkejh.supabase.co';
    const SUPABASE_KEY='sb_publishable_gjYA4-E-BL0X1hc3YugqyQ_1VaOo_se';
    const PIN='1234';
    const KDS_RESTAURANT_ID='02da399f-b12d-480b-bf53-5491bbe8f9e5';
    let supabaseClient=null,initialized=false,lastOrderIds=new Set(),oldCount=0,pollTimer=null,realtimeChannel=null,realtimeRefreshTimer=null,orderCache=new Map();
    let audioCtx = null;
    const $=id=>document.getElementById(id);
    const esc=v=>String(v??'').replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const getConfig=()=>({url:SUPABASE_URL,key:SUPABASE_KEY});
    const apiBase=()=>getConfig().url.replace(/\/$/,'')+'/functions/v1/kitchen-api';

    function initAudio(){
      if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      if(audioCtx.state==='suspended') audioCtx.resume();
    }
    function playDing(){
      try{
        initAudio();
        const o=audioCtx.createOscillator(); const g=audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination);
        o.frequency.value=880; o.type='sine';
        g.gain.setValueAtTime(0.5, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime+0.5);
        o.start(); o.stop(audioCtx.currentTime+0.5);
      }catch(e){console.log('audio blocked',e)}
    }

    async function requestNotificationPermission(){
      if(!('Notification' in window)) return;
      if(Notification.permission==='default'){try{await Notification.requestPermission();}catch(e){}}
    }
    function notifyNewOrder(){
      if('Notification' in window && Notification.permission==='granted'){try{new Notification('طلب جديد');}catch(e){}}
    }
    function showConfig(){$('configScreen').classList.remove('hidden');$('pinScreen').classList.add('hidden');$('app').classList.add('hidden');}
    function showPin(){$('configScreen').classList.add('hidden');$('pinScreen').classList.remove('hidden');$('app').classList.add('hidden');setTimeout(()=>$('pin').focus(),50);}
    function showApp(){$('configScreen').classList.add('hidden');$('pinScreen').classList.add('hidden');$('app').classList.remove('hidden');}

    async function initSupabase(){
      try{supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);initialized=true;return true;}
      catch(e){console.error('Supabase init failed',e);$('configError').textContent='تعذر تشغيل خدمة المطبخ.';$('configError').classList.remove('hidden');showPin();return false;}
    }
    async function callApi(method='GET',body=null){
      const options={method,headers:{'Content-Type':'application/json','x-kitchen-pin':PIN}};
      if(body) options.body=JSON.stringify(body);
      const res=await fetch(apiBase(),options);
      const data=await res.json().catch(()=>({error:'استجابة غير صالحة'}));
      if(!res.ok) throw new Error(data.error||'فشل الاتصال بخدمة المطبخ');
      return data;
    }
    function deliveryStatus(order){const d=order.delivery_orders;return Array.isArray(d)?d[0]?.status:d?.status;}
    function isClosed(order){const s=String(order.status||'').toLowerCase(),ds=String(deliveryStatus(order)||'').toLowerCase();return ['cancelled','canceled','delivered'].includes(s)||['cancelled','canceled','delivered'].includes(ds);}
    function kitchenStatus(order){const s=String(order.kitchen_status||'').toLowerCase();if(s==='cooking')return'preparing';if(s==='new'||!s)return'received';return['received','preparing','ready'].includes(s)?s:'received';}

    async function loadOrders(){
      if(!initialized)return;
      try{
        const rpc=await supabaseClient.rpc('kds_get_grouped_orders',{p_restaurant_id:KDS_RESTAURANT_ID,p_pin:PIN});
        if(rpc.error)throw rpc.error;
        const data=Array.isArray(rpc.data)?rpc.data:[];
        const orders=data.filter(o=>!isClosed(o));
        orderCache=new Map(orders.map(o=>[String(o.id),o]));
        const ids=new Set(orders.map(o=>String(o.id)));
        const newOrders=orders.filter(o=>!lastOrderIds.has(String(o.id)));
        if(oldCount>0 && newOrders.length>0){playDing();notifyNewOrder();}
        oldCount=orders.length;
        lastOrderIds=ids;
        $('connection').textContent='متصل — الطلبات تتحدث تلقائيًا';
        $('connection').className='text-xs text-emerald-400';
        renderOrders(orders);
      }catch(e){$('connection').textContent='تعذر الاتصال بخدمة المطبخ';$('connection').className='text-xs text-red-400';console.error(e);}
    }
    function parseItems(order){
      const raw=order.items??[];
      if(Array.isArray(raw))return raw;
      if(typeof raw==='string'){try{const p=JSON.parse(raw);return Array.isArray(p)?p:[raw];}catch{return[raw];}}
      if(raw&&typeof raw==='object')return Object.entries(raw).map(([name,qty])=>({name,quantity:qty}));
      return[];
    }
    function itemText(item){
      if(typeof item==='string')return esc(item);
      if(!item||typeof item!=='object')return esc(item??'');
      const name=item.name??item.title??item.product_name??item.item_name??item.product??'صنف';
      const qty=item.quantity??item.qty??item.count??1;
      return `${esc(name)} × ${esc(qty)}`;
    }
    function renderOrders(orders){
      const root=$('orders');root.innerHTML='';$('empty').classList.toggle('hidden',orders.length>0);
      orders.forEach(order=>{
        const external=order.order_type==='delivery',tableNo=order.table_number??'-',customer=order.customer_name??'-',phone=order.customer_phone??'-',address=order.address??'-',total=order.total??'-',status=kitchenStatus(order),items=parseItems(order),id=order.id,created=order.created_at?new Date(order.created_at).toLocaleString('ar-EG'):'';
        const card=document.createElement('article');
        card.className='bg-white text-slate-950 rounded-2xl shadow-xl overflow-hidden border-4 '+(status==='ready'?'border-emerald-500':status==='preparing'?'border-amber-500':'border-red-500');
        card.innerHTML=`<div class="px-4 py-3 bg-slate-900 text-white flex justify-between items-center gap-2"><div class="font-extrabold">${external?'خارجي — دليفري':'داخلي — ترابيزة '+esc(tableNo)}</div><div class="text-xs text-slate-300">${esc(created)}</div></div><div class="p-4 space-y-3"><div class="grid grid-cols-2 gap-2 text-sm"><div><b>العميل:</b> ${esc(customer)}</div><div><b>الهاتف:</b> ${esc(phone)}</div><div class="col-span-2"><b>العنوان:</b> ${external?esc(address):'طلب داخل المطعم'}</div>${external?'':`<div><b>رقم الترابيزة:</b> ${esc(tableNo)}</div>`}<div><b>الحالة:</b> ${esc(status)}</div></div><div class="border-t pt-3"><h3 class="font-extrabold mb-2">الأصناف</h3><ul class="list-disc pr-5 space-y-1 text-sm">${items.length?items.map(i=>`<li>${itemText(i)}</li>`).join(''):'<li>لا توجد أصناف</li>'}</ul></div><div class="text-lg font-extrabold border-t pt-3">الإجمالي: ${esc(total)}</div><div class="grid grid-cols-1 sm:grid-cols-3 gap-2"><button data-action="status" data-status="received" data-id="${esc(id)}" class="rounded-lg bg-slate-200 hover:bg-slate-300 py-2 px-2 text-xs font-extrabold">تم الاستلام</button><button data-action="status" data-status="preparing" data-id="${esc(id)}" class="rounded-lg bg-amber-500 hover:bg-amber-400 py-2 px-2 text-xs font-extrabold">جاري التجهيز</button><button data-action="ready" data-id="${esc(id)}" class="rounded-lg bg-emerald-500 hover:bg-emerald-400 py-2 px-2 text-xs font-extrabold">الطلب جاهز</button></div><button data-action="archive" data-id="${esc(id)}" class="w-full rounded-lg bg-red-600 hover:bg-red-500 text-white py-2 font-extrabold">مسح الأوردر</button></div>`;
        root.appendChild(card);
      });
    }
    function sourceOrderIds(id){
      const row=orderCache.get(String(id));
      return Array.isArray(row?.source_order_ids)&&row.source_order_ids.length?row.source_order_ids:[id];
    }
    async function applyKitchenAction(id,action,status){
      const ids=sourceOrderIds(id);
      for(const orderId of ids){
        const body=action==='status'?{action:'update_status',order_id:orderId,new_status:status}:action==='ready'?{action:'ready',id:orderId}:{action:'archive',id:orderId};
        await callApi('POST',body);
      }
    }
    async function updateStatus(id,status){try{await applyKitchenAction(id,'status',status);await loadOrders();}catch(e){alert(e.message);}}
    async function readyOrder(id){try{await applyKitchenAction(id,'ready');await loadOrders();}catch(e){alert(e.message);}}
    async function archiveOrder(orderId){
      if(!confirm('هل تريد مسح الأوردر من المطبخ فقط؟'))return;
      try{await applyKitchenAction(orderId,'archive');await loadOrders();}catch(e){alert(e.message);}
    }
    function startPolling(){clearInterval(pollTimer);pollTimer=setInterval(loadOrders,15000);}
    function startRealtime(){
      if(!supabaseClient)return;
      try{
        if(realtimeChannel)supabaseClient.removeChannel(realtimeChannel);
        realtimeChannel=supabaseClient.channel('kds-orders').on('postgres_changes',{event:'INSERT',schema:'public',table:'orders'},()=>{clearTimeout(realtimeRefreshTimer);realtimeRefreshTimer=setTimeout(()=>{playDing();loadOrders();},700);}).subscribe();
      }catch(e){console.warn('Realtime unavailable',e);}
    }

    async function verifyPin(){
      initAudio();
      if($('pin').value.trim()===PIN){localStorage.setItem('kds_auth','1');await requestNotificationPermission();showApp();await loadOrders();startPolling();startRealtime();}
      else{$('pinError').classList.remove('hidden');$('pin').value='';$('pin').focus();}
    }
    $('login').onclick=verifyPin;
    $('pin').onkeydown=e=>{if(e.key==='Enter')verifyPin();};
    $('logout').onclick=()=>{localStorage.removeItem('kds_auth');clearInterval(pollTimer);if(realtimeChannel&&supabaseClient){supabaseClient.removeChannel(realtimeChannel);realtimeChannel=null;}showPin();};
    $('orders').addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b)return;const id=b.dataset.id;if(b.dataset.action==='archive')archiveOrder(id);else if(b.dataset.action==='ready')readyOrder(id);else if(b.dataset.action==='status')updateStatus(id,b.dataset.status);});
    (async()=>{
      if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('/kds/sw.js',{scope:'/kds/'}).catch(()=>{}),{once:true});}
      const ok=await initSupabase();if(!ok)return;
      if(localStorage.getItem('kds_auth')==='1'){initAudio();requestNotificationPermission();showApp();await loadOrders();startPolling();startRealtime();}else showPin();
    })();
  </script>
</body>
</html>
